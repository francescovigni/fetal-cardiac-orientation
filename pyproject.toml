[project]
name = "fho"
version = "0.1.0"
description = "Fetal cardiac detection and orientation estimation on four-chamber ultrasound"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:fho.*"]

[tool.coverage.run]
source = ["src/fho"]
omit = ["src/fho/figures.py"]          # plotting; asserted visually, not in CI

[tool.coverage.report]
skip_empty = true
exclude_lines = ['if __name__ == "__main__":', "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # long lines live in prose-heavy docstrings, which are the point
    "C408",   # dict(a=1) reads better than {"a": 1} for the record-style returns here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]                   # sys.path is set in conftest before imports
